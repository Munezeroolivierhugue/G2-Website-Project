<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Project</title>
    <link href="./src/output.css" rel="stylesheet">
</head>
<body>
    <header class="flex z-20 justify-between px-3 py-2 sm:px-10 items-center lg:items-start fixed w-full">
        <div id="logo"></div>
        <div id="name" class="py-7"></div>
        <div id="menu"></div>
    </header>
    <main class="relative">
        <div id="navigation"></div>
        <div id="services" class="py-48"></div>
        <div id="reference" class="w-full"></div>
    </main>
    <a href="contact.html">go to contact</a>

    <script>
        const loadComponents = (id, url, callback) => {
            fetch(url)
                .then((response) => response.text())
                .then((html) => {
                    document.getElementById(id).innerHTML = html;
                    if (callback) callback();
                });
        }

        window.onload = () => {
            loadComponents('logo', 'src/sections/Logo.html');
            loadComponents('name', 'src/sections/Name.html');
            loadComponents('menu', 'src/sections/Menu.html', () => {
                document.querySelectorAll(".nav-btn").forEach((btn) => {
                    btn.addEventListener("click", () => {
                        document.querySelector(".nav-ui").classList.toggle("hidden");
                        document.querySelector(".open").classList.toggle("hidden");
                        document.querySelector(".close").classList.toggle("hidden");
                    });
                });
            });
            loadComponents('navigation', 'src/sections/navigation.html');
            loadComponents("reference", "src/sections/Reference.html");
            loadComponents('services', 'src/sections/Services.html', () => {
                // Add scroll event listener after services are loaded
                const yellowSvg = document.getElementById('yellow-svg');
                const service2 = document.getElementById('service2');
                const referenceSection = document.getElementById('reference');

                window.addEventListener('scroll', () => {
                    const service2Rect = service2.getBoundingClientRect();
                    const referenceBottom = referenceSection.getBoundingClientRect().bottom;

                    // Check if service2 is in view and reference section is still visible
                    if (service2Rect.top <= 0 && referenceBottom > 0) {
                        yellowSvg.style.position = 'fixed';
                        yellowSvg.style.top = '0';
                        // yellowSvg.style.left = '50%';
                        // yellowSvg.style.transform = 'translateX(-50%)';
                        yellowSvg.style.zIndex = '05';
                    } else {
                        yellowSvg.style.position = 'static';
                        yellowSvg.style.transform = 'none';
                    }
                });
            });
        }
    </script>
</body>
</html>
