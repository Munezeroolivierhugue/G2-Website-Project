<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Project</title>
    <link href="./src/output.css" rel="stylesheet">
</head>
<script>
    const loadComponents = (id, url,callback) => {
        fetch(url)
            .then((response) => response.text())
            .then((html) => {
                document.getElementById(id).innerHTML = html;
                if (callback) callback();
            });
    }

    window.onload = () => {
        loadComponents('logo', 'src/sections/Logo.html');
        loadComponents('name', 'src/sections/Name.html');
        loadComponents('menu', 'src/sections/Menu.html', () => {
        document.querySelectorAll(".nav-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            document.querySelector(".nav-ui").classList.toggle("hidden");
            document.querySelector(".open").classList.toggle("hidden");
            document.querySelector(".close").classList.toggle("hidden");
          });
        });
      });
      loadComponents("navigation", "src/sections/navigation.html");
      loadComponents("color", "src/sections/colors.html");
      loadComponents("reference", "src/sections/Reference.html");
      loadComponents('services', 'src/sections/Services.html');
      loadComponents('footer', 'src/sections/footer.html');
      loadComponents('h1', 'src/components/hero1.html');
      loadComponents('h2', 'src/components/hero2.html');
    }
</script>
<body class="bg-body font-outfit">
    <header class="flex z-10 justify-between px-3 py-2 sm:px-10 items-center lg:items-start fixed w-full">
        <div id="logo" ></div>
        <div id="name" class="py-7"></div>
        <div id="menu" ></div>
    </header>
    <div id="navigation" ></div>
    <div id="color" class="font-extrabold"></div>
    <div id="services"></div>
    <div id="reference" class="w-full"></div>
    <div id="footer"></div>
</body>
</html>
